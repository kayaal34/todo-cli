[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-cli-kayaal"
version = "0.2.0"
description = "A tiny command-line todo manager that stores tasks in a JSON file"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yahya Kayaal" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.scripts]
todo = "todo:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
py-modules = ["todo"]
