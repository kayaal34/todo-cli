name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install . pytest
      - run: pytest -q
      - name: Installed command works
        run: |
          todo --db /tmp/tasks.json add -t ci Check the console script
          todo --db /tmp/tasks.json list | grep "Check the console script"
